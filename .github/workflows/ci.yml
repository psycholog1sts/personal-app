name: guardian-ci

on:
  push:
    branches:
      - guardian-mvp-20260903
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
