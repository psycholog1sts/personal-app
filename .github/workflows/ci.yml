name: rlsproof-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://psycholog1sts.github.io/personal-app
        run: npm run build
      - name: Verify static publication
        env:
          NEXT_PUBLIC_SITE_URL: https://psycholog1sts.github.io/personal-app
        run: npm run verify:site

  action-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Composite action allows clean fixture
        id: clean
        uses: ./
        with:
          target: test/fixtures/clean
          report-path: rlsproof-clean-report.json
      - name: Assert clean fixture is not blocked
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.clean.outputs.release-gate }}" = "blocked" ]; then
            echo "Clean fixture must not be blocked"
            exit 1
          fi
          test -f rlsproof-clean-report.json
      - name: Composite action blocks vulnerable fixture
        id: vulnerable
        continue-on-error: true
        uses: ./
        with:
          target: test/fixtures/vulnerable
          report-path: rlsproof-vulnerable-report.json
      - name: Assert vulnerable fixture fails the release gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.vulnerable.outcome }}" != "failure" ]; then
            echo "Vulnerable fixture must fail the composite action"
            exit 1
          fi
          test -f rlsproof-vulnerable-report.json

  external-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install RLSProof dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install checksum-verified scanners
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/rlsproof-bin"
          bash scripts/install-external-scanners.sh "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Verify pinned scanner versions
        shell: bash
        run: |
          set -euo pipefail
          gitleaks version
          osv-scanner --version
          opengrep --version
      - name: External scanner integration contract
        env:
          GUARDIAN_EXTERNAL_INTEGRATION: '1'
        run: node --test test/external-integration.test.js
