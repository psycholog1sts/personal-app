name: RLSProof Release Gate
description: Deterministic Supabase-focused release gate for pull requests and deploys.
author: RLSProof

inputs:
  target:
    description: Repository directory to scan.
    required: false
    default: .
  report-path:
    description: Path for the normalized JSON report.
    required: false
    default: rlsproof-report.json
  sarif-path:
    description: Path for the SARIF 2.1.0 report. RLSProof writes the file but does not upload it or request security-events permission.
    required: false
    default: rlsproof-results.sarif
  scan-mode:
    description: "Static scan mode: native or full. Full installs and runs pinned Gitleaks, OSV-Scanner and Opengrep engines."
    required: false
    default: native
  baseline-report:
    description: "Optional reviewed RLSProof report used as a static regression baseline. Requires complete matching static engine coverage."
    required: false
    default: ''
  db-proof:
    description: "Supabase database proof mode: off, auto, or required."
    required: false
    default: off

outputs:
  release-gate:
    description: "Release gate state: blocked, review, incomplete, or clear."
    value: ${{ steps.gate.outputs.release-gate }}
  score:
    description: Readiness score from 0 to 100.
    value: ${{ steps.gate.outputs.score }}
  findings:
    description: Number of normalized findings.
    value: ${{ steps.gate.outputs.findings }}
  report-path:
    description: Path to the generated JSON report.
    value: ${{ steps.gate.outputs.report-path }}
  sarif-path:
    description: Path to the generated SARIF 2.1.0 report.
    value: ${{ steps.gate.outputs.sarif-path }}
  db-proof:
    description: Supabase DB proof status for this run.
    value: ${{ steps.gate.outputs.db-proof }}
  scan-mode:
    description: Static scan mode executed for this run.
    value: ${{ steps.gate.outputs.scan-mode }}
  coverage-complete:
    description: Whether all requested static scan engines completed.
    value: ${{ steps.gate.outputs.coverage-complete }}
  baseline-mode:
    description: "Static gate mode: off or regression."
    value: ${{ steps.gate.outputs.baseline-mode }}
  regressions:
    description: Number of new or severity-escalated static findings relative to the baseline.
    value: ${{ steps.gate.outputs.regressions }}
  resolved-findings:
    description: Number of baseline static findings absent from the current scan.
    value: ${{ steps.gate.outputs.resolved-findings }}

runs:
  using: composite
  steps:
    - name: Setup Node 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - name: Install checksum-verified full-scan engines
      if: ${{ inputs.scan-mode == 'full' }}
      shell: bash
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP:-/tmp}/rlsproof-external-bin"
        bash "$GITHUB_ACTION_PATH/scripts/install-external-scanners.sh" "$bin"
        echo "$bin" >> "$GITHUB_PATH"
    - name: Run RLSProof release gate
      id: gate
      shell: bash
      env:
        RLSPROOF_TARGET: ${{ inputs.target }}
        RLSPROOF_REPORT_PATH: ${{ inputs.report-path }}
        RLSPROOF_SARIF_PATH: ${{ inputs.sarif-path }}
        RLSPROOF_SCAN_MODE: ${{ inputs.scan-mode }}
        RLSPROOF_BASELINE_REPORT: ${{ inputs.baseline-report }}
        RLSPROOF_DB_PROOF: ${{ inputs.db-proof }}
      run: node "$GITHUB_ACTION_PATH/src/action/run.js"

branding:
  icon: shield
  color: green
